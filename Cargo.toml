[package]
name = "vampus"
version = "0.4.6"
description = "A CLI tool for automated semantic version management across configurable file patterns."
license = "MIT"
repository = "https://github.com/atareao/vampus"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = { version = "0.0.60", package = "noyalib" }
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
